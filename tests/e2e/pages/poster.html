<!doctype html>
<!-- Dev-only page: renders one sample poster full-size for screenshots. Not shipped. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../../src/fonts.css">
  <style>html, body { margin: 0; } svg { display: block; width: 1200px; height: 1800px; }</style>
</head>
<body>
  <script type="module">
    import { SAMPLES } from '../../../src/samples.js';
    import { renderPoster } from '../../../src/poster.js';
    const index = Number(new URLSearchParams(location.search).get('i') ?? 0);
    await document.fonts.load("100px 'Limelight'");
    await document.fonts.load("700 100px 'Josefin Sans'");
    document.body.innerHTML = renderPoster(SAMPLES[index]);
    document.body.dataset.ready = 'true';
  </script>
</body>
</html>
