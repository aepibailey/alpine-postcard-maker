<!doctype html>
<!-- Dev-only page: renders one poster full-size for screenshots. Not shipped.
     ?i=<sample index>  &peak=<spire|massif|pyramid|random>  &seed=<ridgeline seed>
     &time=<dawn|midday|alpenglow|night>  &layers=village,forest,...  &title= &tagline= &layout=<top|bottom|arched|banner> &font=<limelight|poiret|bebas|josefin> -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../../src/fonts.css">
  <style>html, body { margin: 0; } svg { display: block; width: 1200px; height: 1800px; }</style>
</head>
<body>
  <script type="module">
    import { SAMPLES } from '../../../src/samples.js';
    import { renderPoster } from '../../../src/poster.js';
    const params = new URLSearchParams(location.search);
    const recipe = { ...SAMPLES[Number(params.get('i') ?? 0)] };
    if (params.has('peak')) recipe.peak = params.get('peak');
    if (!params.has('peak') && params.has('seed')) recipe.peak = recipe.peak;
    if (params.has('time')) { recipe.time = params.get('time'); delete recipe.sun; }
    if (params.has('seed')) recipe.peakSeed = Number(params.get('seed'));
    recipe.lettering = { ...recipe.lettering };
    for (const key of ['title', 'tagline', 'layout', 'font']) if (params.has(key)) recipe.lettering[key] = params.get(key);
    if (params.has('layers')) recipe.layers = Object.fromEntries(params.get('layers').split(',').filter(Boolean).map((l) => [l, true]));
    await document.fonts.load("100px 'Limelight'");
    await document.fonts.load("700 100px 'Josefin Sans'");
    await document.fonts.load("100px 'Poiret One'");
    await document.fonts.load("100px 'Bebas Neue'");
    document.body.innerHTML = renderPoster(recipe);
    document.body.dataset.ready = 'true';
  </script>
</body>
</html>
