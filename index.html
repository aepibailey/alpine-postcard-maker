<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <meta name="description" content="Design vintage 1930s-style Alpine travel posters, fully offline.">
  <title>Alpine Postcard Maker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="src/fonts.css">
  <link rel="stylesheet" href="src/app.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header class="masthead">
    <h1>Alpine Postcard Maker</h1>
  </header>

  <main>
    <section class="samples" aria-labelledby="samples-heading">
      <h2 id="samples-heading">Sample posters · art direction preview</h2>
      <div class="carousel" id="carousel" tabindex="0"></div>
      <p class="carousel-hint" id="carousel-hint">Swipe to see all 3</p>
    </section>
    <p class="status" id="offline-status">Checking offline support…</p>
  </main>

  <footer class="footer">
    <span>Version <span id="app-version">…</span></span>
  </footer>

  <div class="update-banner" id="update-banner" hidden>
    <span>New version available</span>
    <button type="button" id="update-button">Tap to refresh</button>
  </div>
</body>
</html>
