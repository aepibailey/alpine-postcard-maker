<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <meta name="description" content="Design vintage 1930s-style Alpine travel posters, fully offline.">
  <title>Alpine Postcard Maker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="src/fonts.css">
  <link rel="stylesheet" href="src/app.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header class="masthead">
    <h1>Alpine Postcard Maker</h1>
  </header>

  <main>
    <section class="editor" aria-label="Poster editor">
      <figure class="poster-frame" id="preview" aria-live="polite"></figure>
      <p class="peak-label" id="peak-label"></p>
      <h2 class="picker-heading" id="peak-heading">Mountain</h2>
      <div class="picker" id="peak-picker" role="radiogroup" aria-labelledby="peak-heading"></div>
      <button type="button" class="roll-button" id="roll-button" hidden>🎲 New ridgeline</button>
      <h2 class="picker-heading" id="time-heading">Time of day</h2>
      <div class="picker picker-time" id="time-picker" role="radiogroup" aria-labelledby="time-heading"></div>
      <h2 class="picker-heading" id="scenery-heading">Scenery</h2>
      <div class="toggles" id="scenery-picker" role="group" aria-labelledby="scenery-heading"></div>
      <p class="hint">Tip: swipe the poster to change the mountain</p>
    </section>
    <p class="status" id="offline-status">Checking offline support…</p>
  </main>

  <footer class="footer">
    <span>Version <span id="app-version">…</span></span>
  </footer>

  <div class="update-banner" id="update-banner" hidden>
    <span>New version available</span>
    <button type="button" id="update-button">Tap to refresh</button>
  </div>
</body>
</html>
