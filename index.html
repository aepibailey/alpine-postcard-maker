<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <meta name="description" content="Design vintage 1930s-style Alpine travel posters, fully offline.">
  <title>Alpine Postcard Maker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="src/app.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header class="masthead">
    <h1>Alpine Postcard Maker</h1>
  </header>

  <main>
    <figure class="poster-frame" aria-label="Placeholder poster">
      <svg class="placeholder" viewBox="0 0 300 450" role="img" aria-labelledby="ph-title">
        <title id="ph-title">Placeholder poster — real posters arrive in milestone M1</title>
        <rect width="300" height="450" fill="#e9a25f"/>
        <path d="M0 330 L110 170 L140 210 L165 180 L250 300 L300 260 L300 450 L0 450 Z" fill="#1f3a5f" opacity="0.35"/>
        <rect x="20" y="190" width="260" height="70" fill="#f3e6c8" stroke="#1f3a5f" stroke-width="2" stroke-dasharray="6 4"/>
        <text x="150" y="220" text-anchor="middle" font-size="16" fill="#1f3a5f" font-family="sans-serif" font-weight="700">PLACEHOLDER</text>
        <text x="150" y="244" text-anchor="middle" font-size="12" fill="#1f3a5f" font-family="sans-serif">Posters coming in M1</text>
      </svg>
    </figure>
    <p class="status" id="offline-status">Checking offline support…</p>
  </main>

  <footer class="footer">
    <span>Version <span id="app-version">…</span></span>
  </footer>

  <div class="update-banner" id="update-banner" hidden>
    <span>New version available</span>
    <button type="button" id="update-button">Tap to refresh</button>
  </div>
</body>
</html>
